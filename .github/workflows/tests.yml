name: Offline PHP application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install distribution PHP CLI and isolation runtime
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli bubblewrap
      - name: Check source offline without capabilities
        run: sudo -n -- python3 scripts/checks-offline.py --php "$(command -v php)" --node "$(command -v node)"
